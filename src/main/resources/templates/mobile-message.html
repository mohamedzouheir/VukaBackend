<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vuka</title>
  <style>
    body { margin:0; background:#fff; color:#1a1a1a;
           font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    @media (prefers-color-scheme: dark) { body { background:#121714; color:#e8edeb; } }
    .wrap { max-width:520px; margin:0 auto; padding:40px 16px; }
  </style>
  <!-- Offline: keeps pages and answers on the phone when the signal drops. See static/offline/mobile.js. -->
  <script src="/offline/mobile.js" defer></script>
</head>
<body>
<div class="wrap">
  <main id="main">
    <!-- Announced when this page replaces a form the reporter was working in. -->
    <p role="status" th:text="${message}">Message</p>
  </main>
</div>
</body>
</html>
