<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready to submit</title>
  <style>
    :root { --ink:#1a1a1a; --green:#0f3d2e; --on-green:#fff; --muted:#5a6b64; --bg:#fff; --panel:#f4f8f6; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --ink:#e8edeb; --green:#7fd1b0; --on-green:#121714; --muted:#9bb0a7; --bg:#121714; --panel:#1a221e; }
    }
    :root[data-theme="dark"] { --ink:#e8edeb; --green:#7fd1b0; --on-green:#121714; --muted:#9bb0a7; --bg:#121714; --panel:#1a221e; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width:520px; margin:0 auto; padding:32px 16px; }
    h1 { font-size:21px; color:var(--green); margin:0 0 10px; }
    p { margin:0 0 16px; }
    .note { background:var(--panel); border-radius:10px; padding:14px; font-size:14px; color:var(--muted); }
    button { width:100%; padding:16px; font-size:17px; font-weight:600; border:none;
             border-radius:8px; background:var(--green); color:var(--on-green); cursor:pointer; margin-top:8px; }
    /* Green on green is invisible, so the focus ring is drawn in the text colour. */
    button:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  </style>
  <!--/* Offline: keeps pages and answers on the phone when the signal drops. See static/offline/mobile.js. */-->
  <script src="/offline/mobile.js" defer></script>
</head>
<body>
<div class="wrap">
  <main id="main">
    <h1>All indicators answered</h1>
    <p>You have answered all <span th:text="${total}">10</span> indicators for
       <span th:text="${submission.getReportingPeriod().getLabel()}">this period</span>.</p>

    <div class="note">
      Submitting confirms these figures in your name. The Department can see where every
      number came from, and can send the report back to you if something needs correcting.
    </div>

    <form th:action="@{'/m/submission/' + ${submission.getId()} + '/submit'}" method="post">
      <button type="submit">Submit to DSAC</button>
    </form>
  </main>
</div>
</body>
</html>
