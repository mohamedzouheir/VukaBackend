<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not part of your role</title>
  <style>
    :root { --ink:#1a1a1a; --green:#0f3d2e; --muted:#5a6b64; --bg:#fff; --panel:#f4f8f6; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --ink:#e8edeb; --green:#7fd1b0; --muted:#9bb0a7; --bg:#121714; --panel:#1a221e; }
    }
    :root[data-theme="dark"] { --ink:#e8edeb; --green:#7fd1b0; --muted:#9bb0a7; --bg:#121714; --panel:#1a221e; }
    body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width:520px; margin:0 auto; padding:40px 16px; }
    h1 { font-size:20px; color:var(--green); margin:0 0 12px; }
    p { margin:0 0 14px; }
    .m { color:var(--muted); font-size:15px; }
    a { color:var(--green); font-weight:700; }
    button { background:none; border:0; padding:0; min-height:44px; font:inherit; font-size:15px;
             color:var(--green); text-decoration:underline; cursor:pointer; }
    :focus-visible { outline:3px solid var(--green); outline-offset:3px; }
  </style>
</head>
<body>
<div class="wrap">
  <main id="main">
    <h1>This part of Vuka is for entity reporters</h1>
    <p role="status" th:if="${roleLabel != null}"
       th:text="'You are signed in' + (${name} != null ? ' as ' + ${name} : '') + ', ' + ${roleLabel} + '.'">You are signed in as a DSAC reviewer.</p>
    <p class="m">Reporters use these screens to capture figures and upload evidence for their own
      organisation. Nobody else can do that on their behalf, so these screens are not shown to other roles.</p>
    <p th:if="${dsac}"><a href="/">Go to your dashboard</a></p>
    <form th:action="@{/m/signout}" method="post">
      <button type="submit">Sign out and sign in as someone else</button>
    </form>
  </main>
</div>
</body>
</html>
