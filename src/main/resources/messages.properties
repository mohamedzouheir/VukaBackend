# Citizen surface strings, English. This file is the fallback for every other language:
# a key missing from a translation renders in English rather than as its own key.
#
# Scope is deliberate. Only the public citizen pages are translated. The reporter and
# reviewer surfaces stay in English for now, because the people using them work in it
# and a half-translated form is worse than an untranslated one.
#
# Translations in messages_af, messages_zu, messages_xh and messages_st have NOT been
# reviewed by a first-language speaker. Say so if asked. They are offered as a working
# implementation of the language surface, not as certified government text, and they
# should go past PanSALB or a departmental translator before anything is published.

