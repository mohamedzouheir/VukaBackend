spring:
  application:
    name: vuka

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vuka}
    username: ${DB_USER:vuka}
    password: ${DB_PASSWORD:vuka}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping matches it,
      # so a drifted entity fails loudly at startup rather than silently at 3am.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  thymeleaf:
    cache: false

  messages:
    basename: messages
    encoding: UTF-8
    # A key missing from a translation falls back to messages.properties, which is English.
    # Left on the default, it would fall back to the server's locale instead, so a missing
    # isiZulu string on a machine set to Afrikaans would render in Afrikaans.
    fallback-to-system-locale: false

server:
  port: ${PORT:8080}
  # Behind a proxy or on Cloud Run, this is what makes request.isSecure() tell the truth, and
  # the auth cookie takes its Secure flag from exactly that. Without it the cookie ships
  # without Secure on an https deployment.
  forward-headers-strategy: framework
  compression:
    # The low-bandwidth surfaces depend on this. Do not turn it off.
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 512

vuka:
  firebase:
    # Leave blank on Cloud Run: application default credentials are used instead.
    # With no usable credential the application still starts, /public works, and every
    # authenticated endpoint answers 401. It fails closed rather than refusing to boot.
    credentials-path: ${FIREBASE_CREDENTIALS:}
    # Path to a file holding the Firebase Web API key, not the key itself, so the value never
    # sits in an environment variable, a process listing or an image layer. Needed only by the
    # server-rendered reporter sign-in; leave it unset and the citizen view and the
    # token-header API carry on working.
    web-api-key-path: ${FIREBASE_WEB_API_KEY_FILE:}

  dev-auth:
    # A local sign in that skips Firebase entirely, so the four role journeys can be walked
    # on a laptop with no Firebase project attached. With this false the filter bean does not
    # exist, so there is no code path to bypass. It must never be true in a deployed
    # environment, and the application logs a warning on every start where it is.
    enabled: ${VUKA_DEV_AUTH:false}

  seed:
    # Loads realistic DSAC entities and three years of history on first start.
    enabled: ${SEED_ENABLED:true}

  demo:
    # Workflow data on top of the reference seed, so every screen has something to act on: Q1
    # submissions in every review state, evidence, a document version history, comment threads,
    # tasks and a completed Q2 template to upload. Every row it writes is ILLUSTRATIVE; see
    # DemoDataService. It runs once, on a database that has the reference seed and no comments
    # or tasks yet, and never on anything else. Turn it off for any real department data.
    enabled: ${VUKA_DEMO_DATA:true}
    # The entity the demo reporter account reports for, by short name from dsac-entities.csv.
    reporter-entity: ${VUKA_DEMO_REPORTER_ENTITY:Iziko}
    # Firebase uids of the demo accounts, so "my tasks" finds their work. Not credentials: a uid
    # identifies an account and grants nothing. With the development sign in instead of Firebase,
    # set these to dev-entity_reporter, dev-dsac_reviewer, dev-dsac_executive and dev-admin.
    reporter-uid: ${VUKA_DEMO_REPORTER_UID:ltqo1Bx0KHe6F8f9D0rgNFFDWzm2}
    reviewer-uid: ${VUKA_DEMO_REVIEWER_UID:Q5DNyQ3TDYc3CwSzG24ZJQpgLlR2}
    executive-uid: ${VUKA_DEMO_EXECUTIVE_UID:NHNPeeVy4FPZuysWOicH0YGU8CD3}
    admin-uid: ${VUKA_DEMO_ADMIN_UID:GU3tiUG3bsQtwMSlmJIBT2k4B8s2}
    # Where the completed Q2 template for the reporter to upload is written.
    output-dir: ${VUKA_DEMO_OUTPUT_DIR:./var/demo}

  documents:
    # Where uploaded evidence is stored, content-addressed by SHA-256. On a multi-instance
    # deployment this must be a shared volume: two instances with two local directories means
    # half the downloads 404. Object storage is one DocumentStore implementation away.
    root: ${DOCUMENT_ROOT:./var/documents}

  mail:
    # Deadline reminders by email. With no host, nothing is sent and every reminder is still
    # logged. Any SMTP relay works: Microsoft 365, Azure Communication Services, SendGrid or a
    # government relay. Port 587 with STARTTLS.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # A path to a file holding the SMTP password, not the password itself.
    password-path: ${MAIL_PASSWORD_FILE:}
    from: ${MAIL_FROM:}
    # Sends every reminder to this one address instead, naming the intended recipients in the
    # body. The seeded contact addresses are invented, so set this for any demonstration.
    redirect-to: ${MAIL_REDIRECT_TO:}

  microsoft:
    # Nothing here is required. With no tenant configured, workspaces, document versioning,
    # comments and tasks all work and the integration reports itself as not configured.
    #
    # The app registration needs Files.ReadWrite.All or Sites.ReadWrite.All as an APPLICATION
    # permission with admin consent. Sites.Selected plus a per-library grant is the smaller
    # and better-argued configuration for a real department.
    tenant-id: ${MS_TENANT_ID:}
    client-id: ${MS_CLIENT_ID:}
    # A path to a file holding the client secret, not the secret itself. Same rule as the
    # Firebase web API key: the value never sits in an environment variable or an image layer.
    client-secret-path: ${MS_CLIENT_SECRET_FILE:}
    graph-base-url: ${MS_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
    login-base-url: ${MS_LOGIN_BASE_URL:https://login.microsoftonline.com}
    # Turns the background poller off without unconfiguring the tenant.
    sync-enabled: ${MS_SYNC_ENABLED:true}
    # Push queued uploads every minute; ask each bound drive what changed every five.
    mirror-interval-ms: ${MS_MIRROR_INTERVAL_MS:60000}
    poll-interval-ms: ${MS_POLL_INTERVAL_MS:300000}
    max-files-per-sync: ${MS_MAX_FILES_PER_SYNC:50}
    max-file-bytes: ${MS_MAX_FILE_BYTES:15728640}

  karabo:
    # The assistant, on a model deployed in Microsoft Foundry. With nothing set here Karabo says
    # it is not connected and every other screen is unaffected.
    #
    # The endpoint of the Foundry resource, as https://<resource>.openai.azure.com, and the name
    # given to the model deployment there. The deployment name is yours, not the model's.
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    deployment: ${AZURE_DEPLOYMENT_NAME:}
    # A path to a file holding the API key, not the key itself, as for every other secret here.
    api-key-path: ${AZURE_OPENAI_API_KEY_FILE:}
    # The key itself. Accepted for a laptop; the file wins where both are set. Never in a deployment.
    api-key: ${AZURE_OPENAI_API_KEY:}
    # Whether someone who is not signed in may ask at all. Either way they reach published data only.
    public-enabled: ${KARABO_PUBLIC_ENABLED:true}
    # The cost ceiling for the public: questions per minute and per day from one address.
    per-minute-public: ${KARABO_PER_MINUTE_PUBLIC:6}
    per-day-public: ${KARABO_PER_DAY_PUBLIC:60}
    per-minute-signed-in: ${KARABO_PER_MINUTE_SIGNED_IN:20}

logging:
  level:
    za.gov.dsac.vuka: DEBUG
